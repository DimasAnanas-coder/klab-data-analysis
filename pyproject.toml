[project]
name = "klab-data-analysis"
version = "0.1.0"
description = "Lookup product versions and vulnerability information"
readme = "README.md"
authors = [
    { name = "DimasAnanas-coder", email = "nikitin2007dima@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "dotenv>=0.9.9",
    "ijson>=3.4.0",
]

[project.scripts]
klab-data-analysis = "klab_data_analysis.main:main"
klab-data-import = "klab_data_analysis.infrastructure.importer:cli"
klab-data-init = "klab_data_analysis.infrastructure.initializer:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
